name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-and-test:
    name: Lint, Test, Build & Containerize
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install dependencies in editable mode
        run: |
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: Type Checking with mypy
        run: |
          mypy src

      - name: Run Test Suite with Coverage (fail under 80%)
        run: |
          pytest -v --cov=hotel_booking --cov-report=term-missing --cov-fail-under=80

      - name: Build Package (wheel and sdist)
        run: |
          python -m build

      - name: Verify Distribution Artifacts
        run: |
          ls -la dist

      - name: Upload Build Artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: dist/*
          retention-days: 7

      - name: Build Docker Image
        if: matrix.python-version == '3.12'
        run: |
          docker build -t hotel-booking:ci .
